name: cd

# Continuous delivery. Runs only on `v*` tags:
#   1. re-runs the test gate (a tag must never ship red code),
#   2. builds + publishes release binaries to the GitHub release,
#
# Binary targets:
#   x86_64-unknown-linux-musl  fully static 64-bit Linux
#   arm-unknown-linux-musleabihf fully static 32-bit ARM (old Pi / routers),
#     built with cargo-zigbuild (Zig provides the musl cross toolchain)
#   x86_64-pc-windows-gnu      64-bit Windows, cross-compiled on Linux with
#     mingw-w64; RUSTFLAGS links the mingw runtime statically so the .exe
#     has no extra DLL dependencies
#   aarch64-apple-darwin        Apple Silicon, native runner
# Docker stays amd64+arm64: 64-bit covers every supported Pi OS install,
# while arm/v6 are served by the armv6 binary.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  release-binaries:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            builder: cargo
            apt_pkgs: musl-tools
            rustflags: ""
            archive: targz
            exe: ""
          - os: ubuntu-latest
            target: arm-unknown-linux-musleabihf
            builder: zigbuild
            apt_pkgs: ""
            rustflags: ""
            archive: targz
            exe: ""
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            builder: cargo
            apt_pkgs: mingw-w64
            rustflags: "-C link-arg=-static"
            archive: zip
            exe: .exe
          - os: macos-14 # Apple Silicon runner
            target: aarch64-apple-darwin
            builder: cargo
            apt_pkgs: ""
            rustflags: ""
            archive: targz
            exe: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross toolchain (Linux)
        if: matrix.apt_pkgs != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_pkgs }}
      - uses: mlugg/setup-zig@v2
        if: matrix.builder == 'zigbuild'
        with:
          version: 0.15.1
      - name: Install cargo-zigbuild
        if: matrix.builder == 'zigbuild'
        run: cargo install cargo-zigbuild --version 0.23.4 --locked
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          if [ "${{ matrix.builder }}" = "zigbuild" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: List Windows DLL imports (must be system DLLs only)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: x86_64-w64-mingw32-objdump -p "target/${{ matrix.target }}/release/dashcam-hud-rs{{ matrix.exe }}" | grep "DLL Name"
      - name: Package
        shell: bash
        run: |
          STAGE=dist/dashcam-hud-rs
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/dashcam-hud-rs${{ matrix.exe }}" "$STAGE/"
          cp config.json README.md "$STAGE/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && zip -r "../dashcam-hud-rs-${{ matrix.target }}.zip" dashcam-hud-rs)
          else
            tar -czf "dashcam-hud-rs-${{ matrix.target }}.tar.gz" -C dist dashcam-hud-rs
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dashcam-hud-rs-${{ matrix.target }}
          path: dashcam-hud-rs-${{ matrix.target }}.*

  publish-release:
    needs: release-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dashcam-hud-rs-*.tar.gz
            dashcam-hud-rs-*.zip
          generate_release_notes: true

